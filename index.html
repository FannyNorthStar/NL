<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte Postale — Départementales Magazine</title>
<style>
  @font-face {
    font-family: 'Choupinet';
    src: url('./fonts/Choupinet-Regular.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Choupinet', Georgia, serif;
    background: #faf6ec;
    color: #1b3c87;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px;
    min-height: 100vh;
  }

  h1 {
    font-family: 'Choupinet', Georgia, serif;
    font-size: 1.6rem;
    font-weight: normal;
    letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .tagline {
    font-family: 'Choupinet', Georgia, serif;
    font-size: 0.9rem;
    color: #8a7a5a;
    margin-bottom: 24px;
    letter-spacing: 0.06em;
  }

  .hint {
    font-family: system-ui, sans-serif;
    font-size: 0.78rem;
    color: #a09880;
    margin-bottom: 20px;
    text-align: center;
    line-height: 1.6;
  }
  kbd {
    background: #f0ead8;
    border: 1px solid #d8ceae;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 0.75rem;
    color: #7a6c4a;
  }

  /* ── Contrôles ── */
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: center; margin-bottom: 20px;
  }
  .controls label {
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: #8a7a5a;
    display: flex; align-items: center; gap: 6px;
  }
  .controls input[type="number"],
  .controls select {
    background: #fff;
    color: #1b3c87;
    border: 1px solid #d8ceae;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.85rem;
    font-family: system-ui, sans-serif;
  }
  .controls input[type="number"]:focus,
  .controls select:focus {
    outline: none;
    border-color: #1b3c87;
  }

  /* ── Carte ── */
  .canvas-wrap {
    position: relative;
    width: 525px;
    height: 740px;
    border: 1px solid #d8ceae;
    border-radius: 4px;
    overflow: hidden;
    background: #f5edce;
    box-shadow: 0 4px 20px rgba(139, 122, 90, 0.12);
  }

  /* ── Zone photo ── */
  .photo-zone {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 60%;
    overflow: hidden;
    background: #e8e0c8;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
  }
  .photo-zone.dragging { cursor: grabbing; }
  .photo-zone img {
    position: absolute;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }
  .drop-label {
    color: #b0a480;
    font-family: 'Choupinet', Georgia, serif;
    font-size: 1rem;
    pointer-events: none;
    text-align: center;
    line-height: 1.8;
  }

  /* ── Zone texte ── */
  .text-zone {
    position: absolute; bottom: 0; left: 0;
    width: 100%; height: 40%;
    background: #f5edce;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px 32px;
    overflow: hidden;
  }

  .stamp {
    position: absolute; top: 10px; right: 10px;
    width: 56px; height: 66px;
    overflow: hidden;
  }
  .stamp img {
    width: 100%; height: 100%; object-fit: contain;
  }

  .main-text {
    font-family: 'Choupinet', 'Courier New', monospace;
    color: #1b3c87;
    font-size: 15px;
    text-align: center;
    line-height: 1.7;
    width: 100%;
    resize: none;
    border: none;
    background: transparent;
    outline: none;
    min-height: 70px;
  }

  .logo-bottom {
    position: absolute; bottom: 6px; left: 50%;
    transform: translateX(-50%);
    height: 36px;
    opacity: 0.85;
  }
  .logo-bottom img {
    height: 100%;
    object-fit: contain;
  }

  /* ── Séparateur subtil entre photo et texte ── */
  .text-zone::before {
    content: '';
    position: absolute;
    top: 0; left: 10%; right: 10%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #c8b88a, transparent);
  }

  /* ── Boutons ── */
  .actions {
    margin-top: 24px;
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  }
  button {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    border: 1px solid #d8ceae;
    border-radius: 6px;
    padding: 10px 24px;
    cursor: pointer;
    transition: all 0.2s;
  }
  button.primary {
    background: #1b3c87;
    color: #faf6ec;
    border-color: #1b3c87;
  }
  button.primary:hover {
    background: #15306d;
  }
  button.sec {
    background: transparent;
    color: #8a7a5a;
  }
  button.sec:hover {
    background: #f0ead8;
    color: #1b3c87;
  }

  .hidden { display: none; }

  /* ── Footer ── */
  .footer {
    margin-top: 32px;
    font-family: system-ui, sans-serif;
    font-size: 0.7rem;
    color: #b8aa88;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>

<h1>carte postale</h1>
<p class="tagline">la beauté du quotidien</p>

<p class="hint">
  Glissez une photo dans la zone du haut · <kbd>Molette</kbd> zoom · Glissez pour recadrer
</p>

<div class="controls">
  <label>taille du texte
    <input type="number" id="fontSize" value="15" min="8" max="40" step="1" style="width:60px">
  </label>
  <label>format
    <select id="exportFormat">
      <option value="png">PNG</option>
      <option value="jpeg">JPG</option>
      <option value="webp">WebP</option>
    </select>
  </label>
</div>

<div class="canvas-wrap" id="cardWrap">
  <div class="photo-zone" id="photoZone">
    <span class="drop-label" id="dropLabel">glissez votre photo ici<br>ou cliquez</span>
  </div>

  <div class="text-zone" id="textZone">
    <div class="stamp">
      <img src="./timbre.png" alt="timbre">
    </div>

    <textarea class="main-text" id="mainText" rows="4" placeholder="votre texte ici…"></textarea>

    <div class="logo-bottom">
      <img src="./logo.png" alt="logo" id="logoImgEl">
    </div>
  </div>
</div>

<div class="actions">
  <button class="sec" onclick="resetPhoto()">nouvelle photo</button>
  <button class="primary" onclick="exportCard()">exporter</button>
</div>

<p class="footer">départementales magazine</p>

<input type="file" id="photoInput" accept="image/*" class="hidden">

<script>
const CARD_W = 1050, CARD_H = 1480;
const PHOTO_H = Math.round(CARD_H * 0.6);
const TEXT_H  = CARD_H - PHOTO_H;

const photoZone  = document.getElementById('photoZone');
const mainText   = document.getElementById('mainText');
const photoInput = document.getElementById('photoInput');
const dropLabel  = document.getElementById('dropLabel');

let photoImg = null, photoScale = 1, photoX = 0, photoY = 0, dragStart = null;

const timbreImg = new Image(); timbreImg.src = './timbre.png';
const logoImg   = new Image(); logoImg.src   = './logo.png';

/* ══ PHOTO : chargement ══ */
photoZone.addEventListener('click', () => { if (!photoImg) photoInput.click(); });
photoInput.addEventListener('change', (e) => { if (e.target.files[0]) loadPhoto(e.target.files[0]); });

const cardWrap = document.getElementById('cardWrap');
['dragenter','dragover'].forEach(ev =>
  cardWrap.addEventListener(ev, (e) => { e.preventDefault(); e.stopPropagation(); })
);
cardWrap.addEventListener('drop', (e) => {
  e.preventDefault(); e.stopPropagation();
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('image/')) loadPhoto(f);
});

function loadPhoto(file) {
  const img = new Image();
  img.onload = () => {
    photoImg = img;
    const zW = photoZone.offsetWidth, zH = photoZone.offsetHeight;
    photoScale = Math.max(zW / img.width, zH / img.height);
    photoX = (zW - img.width * photoScale) / 2;
    photoY = (zH - img.height * photoScale) / 2;
    renderPhoto();
  };
  img.src = URL.createObjectURL(file);
}

function renderPhoto() {
  photoZone.querySelectorAll('img').forEach(el => el.remove());
  if (!photoImg) { dropLabel.style.display = ''; return; }
  dropLabel.style.display = 'none';
  const el = document.createElement('img');
  el.src = photoImg.src;
  el.style.width  = (photoImg.width  * photoScale) + 'px';
  el.style.height = (photoImg.height * photoScale) + 'px';
  el.style.left   = photoX + 'px';
  el.style.top    = photoY + 'px';
  photoZone.appendChild(el);
}

/* ══ Déplacement ══ */
photoZone.addEventListener('mousedown', (e) => {
  if (!photoImg) return;
  e.preventDefault();
  dragStart = { x: e.clientX - photoX, y: e.clientY - photoY };
  photoZone.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragStart) return;
  photoX = e.clientX - dragStart.x;
  photoY = e.clientY - dragStart.y;
  renderPhoto();
});
window.addEventListener('mouseup', () => {
  dragStart = null;
  photoZone.classList.remove('dragging');
});

/* ══ Zoom ══ */
photoZone.addEventListener('wheel', (e) => {
  if (!photoImg) return;
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.95 : 1.05;
  const r = photoZone.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  photoX = mx - (mx - photoX) * d;
  photoY = my - (my - photoY) * d;
  photoScale *= d;
  renderPhoto();
}, { passive: false });

/* ══ Contrôles ══ */
document.getElementById('fontSize').addEventListener('input', (e) => {
  mainText.style.fontSize = e.target.value + 'px';
});

/* ══ EXPORT ══ */
function exportCard() {
  const canvas = document.createElement('canvas');
  canvas.width = CARD_W; canvas.height = CARD_H;
  const ctx = canvas.getContext('2d');

  const dispW = photoZone.offsetWidth, dispH = photoZone.offsetHeight;
  const rx = CARD_W / dispW, ry = PHOTO_H / dispH;

  // 1) Photo
  if (photoImg) {
    ctx.drawImage(photoImg,
      photoX * rx, photoY * ry,
      photoImg.width * photoScale * rx,
      photoImg.height * photoScale * ry
    );
  } else {
    ctx.fillStyle = '#e8e0c8';
    ctx.fillRect(0, 0, CARD_W, PHOTO_H);
  }

  // 2) Fond zone texte
  ctx.fillStyle = '#f5edce';
  ctx.fillRect(0, PHOTO_H, CARD_W, TEXT_H);

  // 3) Trait séparateur
  const grad = ctx.createLinearGradient(CARD_W * 0.1, 0, CARD_W * 0.9, 0);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(0.5, '#c8b88a');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(CARD_W * 0.1, PHOTO_H, CARD_W * 0.8, 1);

  // 4) Timbre
  if (timbreImg.complete && timbreImg.naturalWidth > 0) {
    const sh = 140;
    const sw = (timbreImg.naturalWidth / timbreImg.naturalHeight) * sh;
    ctx.drawImage(timbreImg, CARD_W - sw - 24, PHOTO_H + 20, sw, sh);
  }

  // 5) Texte principal
  const fs = parseInt(document.getElementById('fontSize').value) || 15;
  const realFS = fs * rx;
  ctx.fillStyle = '#1b3c87';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `${realFS}px Choupinet, Courier New, monospace`;

  const lines = mainText.value.split('\n');
  const lineH = realFS * 1.7;
  const totalH = lines.length * lineH;
  const startY = PHOTO_H + (TEXT_H - totalH) / 2 - 20 * rx;
  lines.forEach((line, i) => {
    ctx.fillText(line, CARD_W / 2, startY + i * lineH + lineH / 2);
  });

  // 6) Logo en bas
  if (logoImg.complete && logoImg.naturalWidth > 0) {
    const lh = 76;
    const lw = (logoImg.naturalWidth / logoImg.naturalHeight) * lh;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(logoImg, (CARD_W - lw) / 2, CARD_H - lh - 14, lw, lh);
    ctx.globalAlpha = 1;
  }

  // Téléchargement
  const fmt = document.getElementById('exportFormat').value;
  const mime = fmt === 'jpeg' ? 'image/jpeg' : fmt === 'webp' ? 'image/webp' : 'image/png';
  const ext  = fmt === 'jpeg' ? 'jpg' : fmt;
  canvas.toBlob((blob) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `carte-postale.${ext}`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, mime, fmt === 'png' ? undefined : 0.92);
}

function resetPhoto() {
  photoImg = null; photoScale = 1; photoX = 0; photoY = 0;
  renderPhoto();
}
</script>
</body>
</html>
